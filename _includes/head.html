<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ site.description }}">
<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          soc: {
            bg: '#050A12',
            card: '#0D1728',
            accent: '#4FC3F7',
            green: '#34D399',
            line: '#1E2D42'
          }
        },
        boxShadow: {
          glow: '0 0 0 1px rgba(79, 195, 247, 0.22), 0 18px 38px rgba(59, 130, 246, 0.15)'
        }
      }
    }
  }
</script>

<style>
  :root {
    color-scheme: dark;
  }

  body {
    margin: 0;
    background:
      radial-gradient(circle at top, rgba(59, 130, 246, 0.12), transparent 28%),
      linear-gradient(180deg, #050A12 0%, #0B1220 100%);
    color: #E2E8F0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
  }

  .soc-grid {
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
    background-size: 28px 28px;
  }

  .panel-glow {
    box-shadow: 0 0 0 1px rgba(79, 195, 247, 0.14), 0 22px 40px rgba(2, 6, 23, 0.7);
  }

  .status-dot {
    box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.18);
  }

  .threat-item-card {
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(2, 6, 23, 0.9));
    border: 1px solid rgba(79, 195, 247, 0.18);
    box-shadow: 0 14px 36px rgba(14, 116, 144, 0.18);
  }

  .threat-source-pill {
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.64rem;
  }
</style>
