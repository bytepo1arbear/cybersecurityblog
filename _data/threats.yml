    services designed to assist in recovery of a corrupted system. In some cases,
    SafePay threat actors deleted all network-attached backups of company data.</td>
    </tr> </tbody> </table> <h2><strong>Incident Response</strong></h2> <p>If a potential
    compromise is detected, but ransomware actors have not (yet) encrypted items,
    organizations should take the following actions:</p> <ol> <li><strong>Determine
    which hosts were compromised and isolate them</strong> by quarantining or taking
    them offline.</li> <li><strong>Initiate threat hunting activities to scope the
    intrusion</strong>. Collect and review relevant artifacts, logs, and other data
    to identify threat actor TTPs, compromised devices and accounts, a timeline of
    activity, etc.</li> <li><strong>Report the suspected compromise</strong> to the
    FBI and other agencies as appropriate (if located within the U.K., report the
    compromise to <a href="https://www.reportfraud.police.uk/" target="_blank">Report
    Fraud</a> or <a href="https://www.police.uk/pu/contact-us/" target="_blank">local
    police force</a>) (see the <a href="https://www.cisa.gov/#Reporting"><strong>Reporting</strong></a><strong>
    </strong>section for contact information).</li> <li><strong>Apply eviction countermeasures</strong>,
    including those listed below, to contain the incident and eradicate the threat
    actor from the network (<strong>Note:</strong> Start applying countermeasures
    after collecting enough threat hunting data to inform effective countermeasure
    selection; this will likely overlap with threat hunting activities). <br /> <ol
    type="a"> <li>Use CISA’s <a href="https://www.cisa.gov/eviction-strategies-tool?utm_source=&utm_medium=CSAEviction"
    title="Eviction Strategies Tool">Eviction Strategies Tool</a> to assemble countermeasures
    for a systematic eviction plan—the tool comprises <strong>Playbook-NG</strong>
    (a web application) and <strong>COUN7ER</strong> (a database of post-compromise
    countermeasures mapped to adversary TTPs). <br /> <ol type="i"> <li>Use Playbook-NG
    and COUN7ER together to assemble a systematic eviction plan, or playbook, that
    leverages distinct countermeasures to contain and evict cyber threat actors. The
    playbook features a list of recommended response actions based on threat actor
    TTPs and includes each action’s intended outcome, preparatory steps, and associated
    risks. For more information, see CISA’s <a href="https://www.cisa.gov/resources-tools/resources/eviction-strategies-tool">Eviction
    Strategies Tool</a> fact sheet.</li> </ol> </li> </ol> </li> <li><strong>Harden
    the network to prevent additional malicious activity</strong> (see <a href="https://www.cisa.gov/#Mitigations"><strong>Mitigations</strong></a>
    for guidance).</li> </ol> <p>If compromise is detected and items have been encrypted,
    see the “Ransomware and Data Extortion Response Checklist” in CISA’s joint <a
    href="https://www.cisa.gov/sites/default/files/2025-03/StopRansomware-Guide%20508.pdf"
    title="#StopRansomware Guide">#StopRansomware Guide</a>.</p> <h2><a id="Mitigations"></a><strong>Mitigations</strong></h2>
    <p>The authoring agencies recommend organizations implement the mitigations below
    to improve their cybersecurity posture on the basis of the threat actors’ activity.
    These mitigations align with the <a href="https://www.cisa.gov/cpg">Cross-Sector
    Cybersecurity Performance Goals (CPGs)</a> developed by CISA and the National
    Institute of Standards and Technology (NIST). The CPGs provide a minimum set of
    practices and protections that CISA and NIST recommend all organizations implement.
    CISA and NIST based the CPGs on existing cybersecurity frameworks and guidance
    to protect against the most common and impactful threats, tactics, techniques,
    and procedures. Visit CISA’s <a href="https://www.cisa.gov/cpg">CPGs</a> webpage
    for more information on the CPGs, including additional recommended baseline protections.</p>
    <p>Organizations should implement the following mitigations:</p> <ul type="square">
    <li><strong>Prioritize remediating known exploited vulnerabilities (KEVs) and
    keep all operating systems, software, and firmware up to date</strong>, as timely
    patching is one of the most efficient and cost-effective steps an organization
    can take to minimize its exposure to cybersecurity threats; specifically, prioritize
    patching <a href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    title="KEVs">KEVs</a> in internet-facing systems. [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#MitigateKnownVulnerabilities2B"
    title="CPG 2.B">CPG 2.B</a>].<br /> <ul type="circle"> <li>Additionally, using
    <a href="https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk">Binding
    Operational Directive 26-04</a> offers a framework for patch prioritization based
    on technology type and steps for forensics triage. Under its implementation guidance,
    it offers guidance and steps to perform forensic triage for severe vulnerability
    cases.</li> </ul> </li> <li><strong>Implement identity, credential, and access
    management (ICAM) policies across the organization and require MFA</strong> for
    all services to the greatest extent possible—particularly for webmail, VPNs, and
    accounts that access critical systems [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#ImplementMultifactorAuthentication3F"
    title="CPG 3.F">CPG 3.F</a>].</li> <li><strong>Require all accounts</strong> with
    password logins (e.g., service accounts, admin accounts, and domain admin accounts)
    to comply with NIST’s <a href="https://pages.nist.gov/800-63-4/" target="_blank"
    title="digital identity guidelines">digital identity guidelines</a>; require employees
    to use long passwords and consider not requiring recurring password changes, as
    these can weaken security [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#EstablishMinimumPasswordStrength3B"
    title="CPG 3.B">CPG 3.B</a>].<br /> <ul type="circle"> <li>Use longer passwords
    consisting of at least 15 characters and no more than 64 characters in length.</li>
    <li>Store passwords in a hashed format using industry-recognized password managers.</li>
    <li>Add password user “salts” to shared login credentials.</li> <li>Avoid reusing
    passwords [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#CreateUniqueCredentials3C"
    title="CPG 3.C">CPG 3.C</a>].</li> <li>Implement multiple failed login attempt
    account lockouts [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#MonitorUnsuccessfulAutomatedLoginAttempts3E"
    title="CPG 3.E">CPG 3.E</a>].</li> <li>Disable password “hints.”</li> <li>Refrain
    from requiring password changes more frequently than once per year.<br /><strong>Note:</strong>
    NIST guidance suggests favoring longer passwords instead of requiring frequent
    password resets. Frequent password resets are more likely to result in users developing
    password patterns cyber threat actors can easily decipher.</li> </ul> </li> <li><strong>Maintain
    offline backups of data and regularly test and maintain backup and restoration
    processes</strong> [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#MaintainSystemBackupsRestorationAbility3O"
    title="CPG 3.O">CPG 3.O</a>]; implementing this practice helps organizations avoid
    severe operational interruptions and prevents scenarios in which data is irretrievable.</li>
    <li><strong>Ensure all backup data is encrypted, immutable</strong> (i.e., cannot
    be altered or deleted), and covers the entire organization’s data infrastructure
    [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#UtilizeStrongEncryption3K"
    title="CPG 3.K">CPG 3.K</a>].</li> <li><strong>Implement a recovery plan</strong>
    to maintain and retain multiple copies of sensitive or proprietary data and servers
    in a physically separate, segmented, and secure location (e.g., hard drives, storage
    devices, or the cloud) [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#ImplementLogicalPhysicalNetworkSegmentation3I"
    title="CPG 3.I">CPG 3.I</a>, <a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#MaintainSystemBackupsRestorationAbility3O"
    title="3.O">3.O</a>, <a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#ManageIncidentResponsePlans1C"
    title="1.C">1.C</a>].</li> <li><strong>Segment networks</strong> to prevent the
    spread of ransomware, as network segmentation can help control traffic flows between,
    and access to, various subnetworks and restrict adversary lateral movement [<a
    href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#ImplementLogicalPhysicalNetworkSegmentation3I"
    title="CPG 3.I">CPG 3.I</a>].</li> <li><strong>Identify, detect, and investigate
    abnormal activity and potential traversal of the indicated ransomware with a network
    monitoring tool</strong> [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#IdentifyAdverseEvents4B">CPG
    4.B</a>].<br /> <ul type="circle"> <li>To aid in detecting ransomware, implement
    a tool that logs and reports all network traffic, including lateral movement activity
    on a network.</li> <li>Endpoint Detection and Response (EDR) tools are particularly
    useful for detecting lateral connections as they have insight into common and
    uncommon network connections for each host.</li> </ul> </li> <li><strong>Filter
    network traffic</strong> by preventing unknown or untrusted origins from accessing
    remote services on internal systems—this prevents threat actors from directly
    connecting to remote access services that they have established for persistence.</li>
    <li><strong>Review domain controllers, servers, workstations, and Active Directories</strong>
    for new, unactive and/or unrecognized accounts.</li> <li><strong>Disable unused
    ports</strong>.</li> <li><strong>Consider adding an email banner to emails received
    from outside of your organization.</strong> </li> <li><strong>Audit user accounts</strong>
    with administrative privileges and configure access controls according to the
    principle of least privilege [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#AdministratorsMaintainSeparateUserandPrivilegedAccounts3G"
    title="CPG 3.G">CPG 3.G</a>].</li> <li><strong>Implement time-based access for
    accounts set at the admin level and higher</strong>; for example, the Just-in-Time
    (JIT) access method provisions privileged access when needed and can support enforcement
    of the principle of least privilege (as well as the <a href="https://www.cisa.gov/resources-tools/resources/zero-trust-maturity-model">Zero
    Trust Maturity Model</a>).<br /> <ul type="circle"> <li>This is a process where
    a network-wide policy is set in place to automatically disable admin accounts
    at the Active Directory level when the account is not in direct need.</li> <li>Individual
    users may submit their requests through an automated process that grants them
    access to a specified system for a set timeframe when they need to support the
    completion of a certain task.</li> </ul> </li> <li><strong>Disable command-line
    and scripting activities and permissions,</strong> since privilege escalation
    and lateral movement often depend on software utilities running from the command
    line; if threat actors cannot run these tools, they will have difficulty escalating
    privileges and moving laterally [<a href="https://www.cisa.gov/cybersecurity-performance-goals-2-0-cpg-2-0#DisableAutorunMacrosByDefault3M"
    title="CPG 3.M">CPG 3.M</a>].</li> </ul> <p>These mitigations align with principles
    provided in the joint guide <a href="https://www.cisa.gov/resources-tools/resources/secure-by-design"
    title="Shifting the Balance of Cybersecurity Risk: Principles and Approaches for
    Secure by Design Software">Shifting the Balance of Cybersecurity Risk: Principles
    and Approaches for Secure by Design Software</a>. CISA urges software manufacturers
    to take ownership of improving the security outcomes of their customers by applying
    these and other secure by design tactics. By implementing secure by design tactics,
    software manufacturers can make their product lines secure “out of the box” without
    requiring customers to make additional configuration changes, purchasing product
    security add-in software and logs, monitoring, and making frequent security updates.</p>
    <h2><strong>Validate Security Controls</strong></h2> <p>In addition to applying
    mitigations, the authoring agencies recommend exercising, testing, and validating
    your organization''s security program against the threat behaviors mapped to the
    MITRE ATT&CK for Enterprise framework in this advisory.</p> <p>To get started:</p>
    <ol> <li>Select an ATT&CK technique described in this advisory (see <a href="https://www.cisa.gov/#Table6"><strong>Table
    6</strong></a> to <a href="https://www.cisa.gov/#Table16"><strong>Table 16</strong></a>).</li>
    <li>Align your security technologies against the technique.</li> <li>Test your
    technologies against the technique.</li> <li>Analyze your detection and prevention
    technologies’ performance.</li> <li>Repeat the process for all security technologies
    to obtain a set of comprehensive performance data.</li> <li>Tune your security
    program, including people, processes, and technologies, based on the data generated
    by this process.</li> </ol> <p>The authoring agencies recommend continually testing
    your security program, at scale, in a production environment to ensure optimal
    performance against the MITRE ATT&CK techniques identified in this advisory.</p>
    <h2><strong>Resources</strong></h2> <ul type="square"> <li><a href="https://www.cisa.gov/stopransomware"
    title="Stopransomware.gov">Stopransomware.gov</a> is a whole-of-government approach
    that provides one central location for ransomware resources and alerts.</li> <li>CISA’s
    <a href="https://www.cisa.gov/stopransomware/ransomware-guide" title="#StopRansomware
    Guide">#StopRansomware Guide</a> provides organizations with comprehensive best
    practices to mitigate the risk of ransomware attacks.</li> <li>CISA’s <a href="https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    title="Known Exploited Vulnerabilities Catalog">Known Exploited Vulnerabilities
    Catalog</a> is an authoritative resource for organizations to support improvement
    of their patch management best practices.</li> <li>CISA’s <a href="https://www.cisa.gov/topics/cybersecurity-best-practices/multifactor-authentication">Multifactor
    Authentication</a> webpage provides best practices for network defenders to mitigate
    threats to accounts and systems that use MFA.</li> <li>CISA’s <a href="https://www.cisa.gov/cyber-hygiene-services"
    title="Cyber Hygiene Services">Cyber Hygiene Services</a> help organizations reduce
    the risk of a successful cyberattack.</li> <li>USSS’s <a href="https://www.secretservice.gov/investigations/cyberincident"
    target="_blank" title="Preparing for a Cyber Incident">Preparing for a Cyber Incident</a>
    outlines basic steps an organization can take before, during, and after a cyber
    incident.</li> <li>CISA’s Cyber Security Evaluation Tool (CSET) provides a systematic,
    disciplined, and repeatable approach for evaluating an organization’s security
    posture; see <a href="https://www.cisa.gov/downloading-and-installing-cset" title="Downloading
    and Installing CSET">Downloading and Installing CSET</a> for step-by-step guidance
    to help your organization evaluate cybersecurity practices on your networks.</li>
    <li>CISA’s <a href="https://www.cisa.gov/resources-tools/services/ransomware-risk-assessment"
    title="Ransomware Risk Assessment">Ransomware Risk Assessment</a> helps assess
    an organization’s ability to counteract a ransomware infection.</li> <li>Department
    of Health and Human Services’ <a href="https://hhscyber.hhs.gov/cybersecurity-performance-goals.html"
    target="_blank" title="Cybersecurity Performance Goals">Cybersecurity Performance
    Goals</a> is a resource to help healthcare organizations implement high-impact
    cybersecurity practices.</li> <li>CISA’s <a href="https://www.cisa.gov/news-events/directives/bod-26-04-prioritizing-security-updates-based-risk">Binding
    Operational Directive 26-04: Prioritizing Security Updates Based on Risk</a> and
    its <a href="https://www.cisa.gov/news-events/directives/bod-26-04-implementation-guidance-prioritizing-security-updates-based-risk">implementation
    guidance</a> </li> <li>CISA’s <a href="https://www.cisa.gov/topics/industrial-control-systems/ci-fortify">CI
    Fortify: Strengthening Resilience Across Critical Infrastructure</a></li> <li>CISA’s
    <a href="https://www.cisa.gov/eviction-strategies-tool">Eviction Strategies Tool</a>
    enables incident response teams to quickly turn observed behaviors into remediation
    plans</li> <li>U.K.’s <a href="https://www.ncsc.gov.uk/" target="_blank">National
    Cyber Security Centre</a> </li> <li>U.K.’s <a href="https://www.nationalcrimeagency.gov.uk/what-we-do/crime-threats/cyber-crime"
    target="_blank">National Crime Agency</a> </li> </ul> <h2><a id="Reporting"></a><strong>Reporting</strong></h2>
    <p>Your organization has no obligation to respond or provide information to the
    FBI and other authoring agencies in response to this joint advisory. If, after
    reviewing the information provided, your organization decides to provide information
    to the FBI or other authoring agencies, reporting must be consistent with applicable
    state and federal laws.</p> <p>The FBI and other authoring agencies are interested
    in any information, to include boundary logs showing communication to and from
    foreign IP addresses, a sample ransom note, communications with threat actors,
    Bitcoin wallet information, decryptor files, and/or a benign sample of an encrypted
    file.</p> <p>Additional details of interest include a targeted company point of
    contact, status and scope of infection, estimated loss, operational impact, transaction
    IDs, date of infection, date detected, initial attack vector, and host- and network-based
    indicators.</p> <p>The authoring agencies do not encourage paying ransom as payment
    does not guarantee victim files will be recovered. Furthermore, payment may also
    embolden adversaries to target additional organizations, encourage other criminal
    actors to engage in the distribution of ransomware, and/or fund illicit activities.
    Regardless of whether you or your organization have decided to pay the ransom,
    the FBI and CISA urge you to promptly report ransomware incidents to the FBI’s
    <a href="https://www.ic3.gov/Home/ComplaintChoice" target="_blank" title="Internet
    Crime Complaint Center (IC3)">Internet Crime Complaint Center (IC3)</a>, a <a
    href="https://www.fbi.gov/contact-us/field-offices" target="_blank" title="local
    FBI field office">local FBI field office</a>, a <a href="https://www.secretservice.gov/contact/field-offices"
    target="_blank" title="local USSS Field Office">local USSS Field Office</a>, or
    CISA via the agency’s <a href="https://www.cisa.gov/report" title="Incident Reporting
    System">Incident Reporting System</a> or its 24/7 Operations Center (<a href="mailto:contact@cisa.dhs.gov"
    title="contact@cisa.dhs.gov">contact@cisa.dhs.gov</a>) or by calling 1-844-Say-CISA
    (1-844-729-2472).</p> <p>In the U.K., report incidents of a cybercrime or fraud
    at the UK’s <a href="https://www.reportfraud.police.uk/" target="_blank">Home
    for Reporting Cyber Crime & Fraud</a> or 0300-123-2040, your <a href="https://www.police.uk/pu/contact-us/"
    target="_blank">local police force</a>, or use the non-emergency number 101.</p>
    <h2><strong>Disclaimer</strong></h2> <p>The information in this report is being
    provided “as is” for informational purposes only. CISA and the FBI/USSS do not
    endorse any commercial entity, product, company, or service, including any entities,
    products, or services linked within this document. Any reference to specific commercial
    entities, products, processes, or services by service mark, trademark, manufacturer,
    or otherwise, does not constitute or imply endorsement, recommendation, or favoring
    by the FBI, CISA, or USSS.</p> <p>The authoring agencies recognize that infrastructure
    used for malicious activity may be hosted on cloud or virtualized platforms where
    IP addresses can be dynamically or temporarily assigned. As a result, an address
    associated with malicious activity at one point in time may later be reassigned
    to benign services. Accordingly, these indicators should be interpreted as historically
    observed infrastructure within the activity window and should be corroborated
    with current network telemetry or additional intelligence sources when used for
    defensive or investigative purposes.</p> <h2><strong>Version History</strong></h2>
    <p><strong>October 20, 2026</strong>: Initial version.</p>'
