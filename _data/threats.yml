    target="_blank">Defensive cybersecurity analysts</a>, <a href="https://niccs.cisa.gov/tools/nice-framework/work-role/vulnerability-analysis"
    target="_blank">vulnerability analysts</a>, <a href="https://niccs.cisa.gov/tools/nice-framework/work-role/systems-security-management"
    target="_blank">security systems managers</a>, and operational technology (OT)
    owners and operators</p> </td> </tr> </tbody> </table> <h2><strong>Introduction</strong></h2>
    <p><strong>Note:</strong> This joint Cybersecurity Advisory is part of an ongoing
    #StopRansomware effort to publish advisories for network defenders that detail
    various ransomware variants and ransomware threat actors. These #StopRansomware
    advisories include recently and historically observed tactics, techniques, and
    procedures (TTPs) and indicators of compromise (IOCs) to help organizations protect
    against ransomware. Visit <a href="https://www.cisa.gov/stopransomware" title="Stopransomware.gov">stopransomware.gov</a>
    to see all #StopRansomware advisories and to learn more about other ransomware
    threats and no-cost resources. </p> <p>The Federal Bureau of Investigation (FBI),
    Cybersecurity and Infrastructure Security Agency (CISA), United States Secret
    Service (USSS), Germany’s Landeskriminalamt Rheinland-Pfalz, the United Kingdom’s
    National Crime Agency, and the United Kingdom’s North West Regional Organised
    Crime Unit—hereafter referred to as the authoring agencies—are releasing this
    joint advisory to disseminate known SafePay ransomware TTPs and IOCs identified
    through FBI, USSS, and Landeskriminalamt Rheinland-Pfalz investigations as recently
    as August 2026.</p> <p>Since August 2024, SafePay ransomware group’s operations
    have affected a wide range of businesses and critical infrastructure in North
    America, South America, Europe, and Australia. SafePay ransomware was among the
    most active ransomware groups in 2026. The SafePay threat actors have impacted
    at least 600 separate victims from multiple critical infrastructure sectors.</p>
    <p>The authoring agencies encourage organizations to implement the recommendations
    in the <a href="https://www.cisa.gov/#Mitigations"><strong>Mitigations</strong></a><strong>
    </strong>section of this advisory to reduce the likelihood and impact of SafePay
    ransomware incidents.</p> <p>Download the PDF version of this report:</p> <div
    class="c-file"> <div class="c-file__download"> <a class="c-file__link" href="https://www.cisa.gov/sites/default/files/2026-10/aa26-293a-stopransomware-safepay-ransomware-508c_0.pdf"
    target="_blank">#StopRansomware: SafePay Ransomware</a> <span class="c-file__size">(PDF,
    1.06 MB )</span> </div> </div> <p>For a downloadable copy of IOCs, see:</p> <div
    class="c-file"> <div class="c-file__download"> <a class="c-file__link" href="https://www.cisa.gov/sites/default/files/2026-10/AA26-293A-stix.xml"
    target="_blank">AA26-293A-STIX XML</a> <span class="c-file__size">(XML, 40.23
    KB )</span> </div> </div> <div class="c-file"> <div class="c-file__download">
    <a class="c-file__link" href="https://www.cisa.gov/sites/default/files/2026-10/AA26-293A-stix.json"
    target="_blank">AA26-293A-STIX JSON</a> <span class="c-file__size">(JSON, 37.49
    KB )</span> </div> </div> <h2><strong>Technical Details</strong></h2> <p><strong>Note:</strong>
    This advisory uses the <a href="https://attack.mitre.org/versions/v20/matrices/enterprise/"
    target="_blank">MITRE ATT&CK<sup>®</sup> Matrix for Enterprise</a> framework,
    version 20. See<strong> </strong><a href="https://www.cisa.gov/#MITRE"><strong>MITRE
    ATT&CK Tactics and Techniques</strong></a> section of this advisory for a table
    of the threat actors’ activity mapped to MITRE ATT&CK tactics and techniques.</p>
    <h3><strong>Initial Access</strong></h3> <p>The FBI, USSS, and cybersecurity researchers
    observed SafePay threat actors obtaining initial access [<a href="https://attack.mitre.org/versions/v20/tactics/TA0001/"
    target="_blank" title="TA0001">TA0001</a>] to organizations through various means,
    including credential exposure, implementing brute force password attacks [<a href="https://attack.mitre.org/versions/v20/techniques/T1110/"
    target="_blank" title="T1110">T1110</a>], and exploiting virtual private network
    (VPN) access. SafePay threat actors use the IP addresses of the VPN provider “Mullvad”
    to attain initial access—specifically, SafePay threat actors use phished account
    profiles to access victim networks to exploit the following known Common Vulnerabilities
    and Exposures (CVEs) for edge device products:</p> <ul type="square"> <li><a href="https://www.cve.org/CVERecord?id=CVE-2020-3259"
    target="_blank">CVE-2020-3259</a> [<a href="https://cwe.mitre.org/data/definitions/200.html"
    target="_blank">Common Weakness Enumeration (CWE)-200: Exposure of Sensitive Information
    to an Unauthorized Actor</a>]</li> <li><a href="https://www.cve.org/CVERecord?id=CVE-2023-20269"
    target="_blank">CVE-2023-20269</a> [<a href="https://cwe.mitre.org/data/definitions/288.html"
    target="_blank">CWE-288: Authentication Bypass Using an Alternate Path or Channel</a>] </li>
    </ul> <p>Additionally, the authoring agencies observed SafePay threat actors exploiting
    the following vulnerabilities across internet-exposed systems [<a href="https://attack.mitre.org/versions/v20/techniques/T1190/"
    target="_blank">T1190</a>] for initial access through automated scripts:</p> <ul
    type="square"> <li><a href="https://www.cve.org/CVERecord?id=CVE-2023-27532" target="_blank"
    title="CVE-2023-27532">CVE-2023-27532</a> [<a href="https://cwe.mitre.org/data/definitions/306.html"
    target="_blank" title="CWE-306: Missing Authentication for Critical Function">CWE-306:
    Missing Authentication for Critical Function</a>]</li> <li><a href="https://www.cve.org/CVERecord?id=CVE-2024-40711"
    target="_blank" title="CVE-2024-40711">CVE-2024-40711</a> [<a href="https://cwe.mitre.org/data/definitions/502"
    target="_blank" title="CWE-502: Deserialization of Untrusted Data">CWE-502: Deserialization
    of Untrusted Data</a>]</li> <li><a href="https://www.cve.org/CVERecord?id=CVE-2024-40766"
    target="_blank" title="CVE-2024-40766">CVE-2024-40766</a> [<a href="https://cwe.mitre.org/data/definitions/284.html"
    target="_blank">CWE-284: Improper Access Control</a>]</li> </ul> <h3><strong>Execution,
    Persistence, Stealth, and Defense Impairment</strong></h3> <p>After SafePay threat
    actors gain access to a victim network, they establish persistence by gaining
    administrative privileges on existing accounts [<a href="https://attack.mitre.org/versions/v20/techniques/T1098/"
    target="_blank">T1098</a>], or on newly created accounts [<a href="https://attack.mitre.org/versions/v20/techniques/T1136/"
    target="_blank">T1136</a>], using built-in administrative tools consistent with
    <a href="https://www.cisa.gov/resources-tools/resources/identifying-and-mitigating-living-land-techniques">living
    off the land (LOTL)</a> techniques. Once SafePay threat actors establish a foothold
    in a victim’s network, they use LOTL binaries (LOLBins) [<a href="https://attack.mitre.org/versions/v20/techniques/T1218/"
    target="_blank">T1218</a>], such as <a href="https://attack.mitre.org/versions/v20/software/S0029/"
    target="_blank">PsExec</a> [<a href="https://attack.mitre.org/versions/v20/techniques/T1021/002/"
    target="_blank">T1021.002</a>] and Windows Remote Management (WinRM) [<a href="https://attack.mitre.org/versions/v20/techniques/T1021/006/"
    target="_blank">T1021.006</a>], to execute commands on remote systems. In several
    instances, SafePay threat actors used <code>ShareFinder.ps1</code>—a PowerShell
    script function used for enumerating network file shares in Windows Active Directory
    environments—to identify valuable assets for exfiltration [<a href="https://attack.mitre.org/techniques/T1059/001/"
    target="_blank">T1059.001</a>, <a href="https://attack.mitre.org/techniques/T1059/003/"
    target="_blank">T1059.003</a>]. Additionally, SafePay threat actors used <code>SharpShares.exe</code>,
    a tool used to identify and enumerate network file shares.</p> <p>As SafePay threat
    actors prepare for lateral movement, they commonly disable security software [<a
    href="https://attack.mitre.org/versions/v20/techniques/T1685/" target="_blank"
    title="T1685">T1685</a>] to avoid detection. In some cases, the threat actors
    changed the passwords of system users, making valid logins impossible. SafePay
    threat actors have also been observed using software packing or virtual machine
    software protection to conceal their code [<a href="https://attack.mitre.org/versions/v20/techniques/T1027/002/"
    target="_blank" title="T1027.002">T1027.002</a>].</p> <h3><strong>Privilege Escalation</strong></h3>
    <p>The authoring agencies observed SafePay threat actors using a User Account
    Control (UAC) Bypass Privilege Escalation technique [<a href="https://attack.mitre.org/versions/v20/techniques/T1548/002/"
    target="_blank">T1548.002</a>] that creates an elevated process through a specified
    component object model, enabling the execution of malicious commands or binaries
    [<a href="https://attack.mitre.org/versions/v20/techniques/T1059/" target="_blank">T1059</a>].
    SafePay threat actors have also been observed using token impersonation methods
    [<a href="https://attack.mitre.org/versions/v20/techniques/T1134/001/" target="_blank">T1134.001</a>].</p>
    <h3><strong>Lateral Movement</strong></h3> <p>To pivot laterally through a network
    and identify files for exfiltration [<a href="https://attack.mitre.org/versions/v20/tactics/TA0010/"
    target="_blank">TA0010</a>] and encryption, SafePay threat actors use legitimate
    tools like PsExec, WinRM, and Remote Management and Monitoring [<a href="https://attack.mitre.org/versions/v20/techniques/T1569/002/"
    target="_blank">T1569.002</a>] software. They also employ Remote Desktop Protocol
    (RDP) [<a href="https://attack.mitre.org/versions/v20/techniques/T1021/001/" target="_blank">T1021.001</a>,
    <a href="https://attack.mitre.org/versions/v20/techniques/T1133/" target="_blank">T1133</a>]
    to expand their presence within the compromised network [<a href="https://attack.mitre.org/versions/v20/techniques/T1021/"
    target="_blank">T1021</a>]. As SafePay threat actors move laterally through a
    network, they look for credentials to gain admin access and will create accounts,
    if needed.</p> <h3><strong>Collection, Exfiltration, and Impact</strong></h3>
    <p>SafePay threat actors use legitimate tools, such as FileZilla, 7-Zip, RClone,
    and WinRAR to compress files and collect data [<a href="https://attack.mitre.org/versions/v20/techniques/T1560/001/"
    target="_blank">T1560.001</a>], and WinSCP and RClone to facilitate the exfiltration
    of data [<a href="https://attack.mitre.org/versions/v20/techniques/T1048/" target="_blank">T1048</a>]
    from the compromised network to actor-controlled accounts. In some instances,
    SafePay threat actors use OneDrive to exfiltrate data [<a href="https://attack.mitre.org/versions/v20/techniques/T1567/"
    target="_blank">T1567</a>]. In other instances, the SafePay threat actors installed
    legitimate remote desktop tools like AnyDesk or TeamViewer on the victim’s systems.
    SafePay threat actors use these tools to transfer ransomware and other software
    onto a victim’s system. Additionally, SafePay threat actors halt the Volume Shadow
    Copy Service and reset Network Attached Storage containing victim backup data
    to initial factory settings to inhibit system recovery attempts [<a href="https://attack.mitre.org/versions/v20/techniques/T1490/"
    target="_blank">T1490</a>].</p> <p>Following exfiltration, SafePay threat actors
    encrypt files [<a href="https://attack.mitre.org/versions/v20/techniques/T1486/"
    target="_blank" title="T1486">T1486</a>] using a sophisticated hybrid encryption
    scheme to lock data. This involves combining a ChaCha20 stream cipher with an
    RSA public-key cryptosystem for a fast and secure key exchange. This multilayered
    approach customizes encryption methods based on file type and size and enables
    full or partial encryption. Data encrypted with the SafePay ransomware variant
    (appended with <code>.SafePay</code>) cannot be recovered without the decryption
    key. SafePay threat actors hold the encrypted data for ransom and typically demand
    a subset of company revenue in cryptocurrency in exchange for decryption software.
    SafePay threat actors leave a ransom note on the victim’s system, typically on
    the desktop or root directory, advising them that SafePay locked their system
    and to reach out over a chat portal at a TOR <code>.onion</code> website link
    with a victim ID as the login. To put pressure on the victim, a representative
    makes phone calls on behalf of the ransomware group. If the victim does not pay,
    SafePay posts the exfiltrated data to their SafePay leak website, which is linked
    in the ransom note. Following encryption, SafePay may delete itself from the victim’s
    filesystem [<a href="https://attack.mitre.org/versions/v20/techniques/T1070/004/"
    target="_blank" title="T1070.004">T1070.004</a>].</p> <h3><strong>Leveraged Tools</strong></h3>
    <p><a href="https://www.cisa.gov/#Table1"><strong>Table 1</strong></a><strong>
    </strong>lists publicly available tools and applications used by SafePay threat
    actors, including legitimate tools repurposed for their operations.<br /><strong>Note:
    </strong>These tools and applications should not be attributed as malicious without
    analytical evidence to support threat actor use and/or control.</p> <table class="tablesaw
    tablesaw-stack"> <caption><a id="Table1"></a><em><strong>Table 1. Tools Leveraged
    by SafePay Threat Actors</strong></em></caption> <thead> <tr> <th>Tool Name</th>
    <th>Description</th> </tr> </thead> <tbody> <tr> <td>7-Zip</td> <td>An open source
    software that enables users to compress various file formats. SafePay threat actors
    maliciously use 7-Zip for data packaging and movement.</td> </tr> <tr> <td>FileZilla</td>
    <td>An open source client that enables users to transfer files between servers.
    SafePay threat actors use FileZilla maliciously for data exfiltration.</td> </tr>
    <tr> <td>Mimikatz</td> <td>A credential dumper that enables users to view and
    save authentication credentials, such as Kerberos tickets [<a href="https://attack.mitre.org/versions/v20/techniques/T1550/002/"
    target="_blank" title="T1550.002">T1550.002</a>]. SafePay threat actors use Mimikatz
    for password exfiltration.</td> </tr> <tr> <td>PowerShell</td> <td>A cross-platform
    task automation solution used for various malicious activities, including command
    execution. It is composed of a command-line shell, a scripting language, and a
    configuration management framework—which runs on Windows, Linux, and macOS. </td>
    </tr> <tr> <td>PsExec</td> <td>A tool designed to run programs that SafePay threat
    actors use to execute commands on remote systems.</td> </tr> <tr> <td>RClone</td>
    <td>A legitimate command-line program used to sync files with cloud storage services,
    such as Mega. SafePay threat actors maliciously use RClone for data packaging
    and movement.</td> </tr> <tr> <td>ScreenConnect</td> <td>A remote support, access,
    and meeting software that allows users to control devices remotely over the internet.
    SafePay threat actors use ScreenConnect for persistence and access.</td> </tr>
    <tr> <td>ShareFinder.ps1</td> <td>A PowerShell script used to scan an Active Directory
    network for shared folders. SafePay threat actors use <code>ShareFinder.ps1</code>
    for exfiltration hunting.</td> </tr> <tr> <td>WinRAR</td> <td>Archive utility
    used to split compromised data into segments and to compress [<a href="https://attack.mitre.org/versions/v20/techniques/T1560/001/"
    target="_blank" title="T1560.001">T1560.001</a>] files into a <code>.RAR</code>
    format prior to exfiltration. SafePay threat actors use WinRAR for data packaging
    and movement.</td> </tr> <tr> <td>WinRM</td> <td>A Windows-based protocol designed
    to facilitate remote management and automation. SafePay threat actors use WinRM
    for command execution.</td> </tr> <tr> <td>AnyDesk and TeamViewer</td> <td>Legitimate
    remote desktop tool used for accessing and controlling computers over the internet.
    SafePay threat actors use AnyDesk and TeamViewer to transfer malware to the victim’s
    system.</td> </tr> <tr> <td>AcronisDiskDirector</td> <td>A legitimate disk management
    tool.</td> </tr> <tr> <td>SharpShares.exe</td> <td>A network scanning tool used
    for host discovery and enumeration.</td> </tr> <tr> <td>NetExec</td> <td>A legitimate
    network assessment tool to enumerate systems, validate credentials, and manage
    remote operations across private networks.</td> </tr> <tr> <td>Backblaze</td>
    <td>A command-line tool for file management within Backblaze B2 cloud storage.
    SafePay threat actors executed commands via <code>b2.exe</code> to exfiltrate
    a victim’s data.</td> </tr> </tbody> </table> <h2><strong>Indicators of Compromise</strong></h2>
