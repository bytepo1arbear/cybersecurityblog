- title: 'The Classics Return: Vulnerable E-Mail Scripts, (Wed, Nov 4th)'
  link: https://isc.sans.edu/diary/rss/33488
  published: '2026-11-04T13:24:13Z'
  summary: 'One of the early web application vulnerabilities I remember was CVE-2000-0411
    [CVE]. This was a simple vulnerability in a CGI-bin script used to send e-mail.
    The vulnerability was pretty straightforward: Adding additional parameters to
    the URL leaked environment variables. Other vulnerabilities allowed setting the
    "To" address and were heavily abused by spammers. And if parameters were passed
