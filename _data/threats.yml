    <li>WIN-I1HRRJHCEIV</li> </ul> <h2><a id="MITRE"></a><strong>MITRE ATT&CK Tactics
    and Techniques </strong></h2> <p>See <a href="https://www.cisa.gov/#Table6"><strong>Table
