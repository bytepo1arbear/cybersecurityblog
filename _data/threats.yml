    target="_blank">CWE-288: Authentication Bypass Using an Alternate Path or Channel</a>]</li>
    <li><a href="https://www.cve.org/CVERecord?id=CVE-2023-27532" target="_blank">CVE-2023-27532</a>
    [<a href="https://cwe.mitre.org/data/definitions/306.html">CWE-306: Missing Authentication
    for Critical Function</a>]</li> <li><a href="https://www.cve.org/CVERecord?id=CVE-2024-40711"
    target="_blank">CVE-2024-40711</a> [<a href="https://cwe.mitre.org/data/definitions/502"
    target="_blank">CWE-502: Deserialization of Untrusted Data</a>]</li> <li><a href="https://www.cve.org/CVERecord?id=CVE-2024-40766"
    target="_blank">CVE-2024-40766</a> [<a href="https://cwe.mitre.org/data/definitions/284.html"
    target="_blank">CWE-284: Improper Access Control</a>]</li> </ul> </td> </tr> <tr>
    <th>Key Actions</th> <td> <ul type="square"> <li><strong>Regularly patch and update
